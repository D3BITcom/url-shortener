packages:
  - "applications/*"
  - "libs/*"

# Supply-chain guardrail: never resolve a version published less than 14 days
# ago (value in minutes). Most malicious releases are caught and yanked within days.
minimumReleaseAge: 20160

# pnpm blocks dependency install scripts by default; allow only the ones we need.
onlyBuiltDependencies:
  - better-sqlite3
  - esbuild
