# /etc/nginx/snippets/url-shortener-proxy.conf
# Shared by the /r locations in nginx.conf.example.

# The app only accepts small form posts; reject anything bigger early.
client_max_body_size 16k;

proxy_pass http://127.0.0.1:3000; # HOST_PORT from the VPS .env
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Proto $scheme;
# nginx appends the real client address. The app trusts exactly one hop
# (TRUST_PROXY=true), so it reads this appended value and ignores anything a
# client put in the header itself.
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
